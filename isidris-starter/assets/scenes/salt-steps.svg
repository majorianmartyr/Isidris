<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-label="Illustration of stone harbor steps by the sea">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#648e93"/><stop offset=".58" stop-color="#b1bfb2"/><stop offset="1" stop-color="#ebc9a4"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7d9e98"/><stop offset="1" stop-color="#294d59"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cdbb9e"/><stop offset="1" stop-color="#657875"/></linearGradient>
    <pattern id="lines" width="72" height="20" patternUnits="userSpaceOnUse"><path d="M0 13 Q26 9 55 13 T110 13" fill="none" stroke="#dde1ce" opacity=".16" stroke-width="1.2"/></pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="650" fill="url(#sky)"/>
  <circle cx="880" cy="166" r="79" fill="#f6dec0" opacity=".76"/>
  <circle cx="880" cy="166" r="115" fill="none" stroke="#f2d6ba" stroke-width="1.5" opacity=".35"/>
